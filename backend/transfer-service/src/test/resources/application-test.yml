spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:transferdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: YmFua2luZy1hdXRoLXRlc3Qtc2VjcmV0LWtleS0wMTIzNDU2Nzg5LWxvY2Fs
  account-service:
    base-url: http://localhost:9999
    internal-token: test-internal-token
    connect-timeout-ms: 200
    read-timeout-ms: 300
    retry-attempts: 1
    retry-delay-ms: 0
  transaction-service:
    base-url: http://localhost:9998
    internal-token: test-internal-token
    connect-timeout-ms: 200
    read-timeout-ms: 300
