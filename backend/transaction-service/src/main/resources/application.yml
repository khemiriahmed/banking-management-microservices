spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5436/transaction_db}
    username: ${TRANSACTION_DB_USER:transaction_user}
    password: ${TRANSACTION_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${TRANSACTION_SERVICE_PORT:8086}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
