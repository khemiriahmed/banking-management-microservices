spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:accountdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: YmFua2luZy1hdXRoLXRlc3Qtc2VjcmV0LWtleS0wMTIzNDU2Nzg5LWxvY2Fs
  internal:
    service-token: test-internal-token
