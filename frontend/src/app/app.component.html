<div class="page">
  <header class="hero">
    <div>
      <p class="eyebrow">Sprint 9</p>
      <h1>{{ title }}</h1>
      <p class="lead">Parcours CLIENT et ADMIN via API Gateway.</p>
    </div>
    <nav class="nav" *ngIf="auth.isAuthenticated()">
      <a routerLink="/dashboard" routerLinkActive="active" *ngIf="auth.hasRole('CLIENT')">Dashboard</a>
      <a routerLink="/accounts" routerLinkActive="active">Comptes</a>
      <a routerLink="/beneficiaries" routerLinkActive="active" *ngIf="auth.hasRole('CLIENT')">Bénéficiaires</a>
      <a routerLink="/transfers" routerLinkActive="active" *ngIf="auth.hasRole('CLIENT')">Virements</a>
      <a routerLink="/transactions" routerLinkActive="active" *ngIf="auth.hasRole('CLIENT')">Transactions</a>
      <a routerLink="/notifications" routerLinkActive="active">Notifications</a>
      <a routerLink="/admin" routerLinkActive="active" *ngIf="auth.hasRole('ADMIN')">Admin</a>
      <button class="ghost" (click)="logout()">Déconnexion</button>
    </nav>
  </header>
  <main><router-outlet></router-outlet></main>
</div>
