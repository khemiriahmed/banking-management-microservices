name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'sprint/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - demo-service
          - auth-service
          - user-service
          - account-service
          - transfer-service
          - transaction-service
          - notification-service
          - audit-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        working-directory: backend/${{ matrix.service }}
        run: bash ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test:ci

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env.example config --quiet
