name: banking-microservices

services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: banking-postgres-auth
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-user:
    image: postgres:16-alpine
    container_name: banking-postgres-user
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USER:-user_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user_user} -d ${USER_DB_NAME:-user_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-account:
    image: postgres:16-alpine
    container_name: banking-postgres-account
    environment:
      POSTGRES_DB: ${ACCOUNT_DB_NAME:-account_db}
      POSTGRES_USER: ${ACCOUNT_DB_USER:-account_user}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}
    ports:
      - "5434:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNT_DB_USER:-account_user} -d ${ACCOUNT_DB_NAME:-account_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-transfer:
    image: postgres:16-alpine
    container_name: banking-postgres-transfer
    environment:
      POSTGRES_DB: ${TRANSFER_DB_NAME:-transfer_db}
      POSTGRES_USER: ${TRANSFER_DB_USER:-transfer_user}
      POSTGRES_PASSWORD: ${TRANSFER_DB_PASSWORD:?TRANSFER_DB_PASSWORD is required}
    ports:
      - "5435:5432"
    volumes:
      - postgres-transfer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRANSFER_DB_USER:-transfer_user} -d ${TRANSFER_DB_NAME:-transfer_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-transaction:
    image: postgres:16-alpine
    container_name: banking-postgres-transaction
    environment:
      POSTGRES_DB: ${TRANSACTION_DB_NAME:-transaction_db}
      POSTGRES_USER: ${TRANSACTION_DB_USER:-transaction_user}
      POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD:?TRANSACTION_DB_PASSWORD is required}
    ports:
      - "5436:5432"
    volumes:
      - postgres-transaction-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRANSACTION_DB_USER:-transaction_user} -d ${TRANSACTION_DB_NAME:-transaction_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  config-server:
    build: ../backend/config-server
    container_name: banking-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_LOCATION: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  discovery-server:
    build: ../backend/discovery-server
    container_name: banking-discovery-server
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  api-gateway:
    build: ../backend/api-gateway
    container_name: banking-api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  demo-service:
    build: ../backend/demo-service
    container_name: banking-demo-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  auth-service:
    build: ../backend/auth-service
    container_name: banking-auth-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
      AUTH_DB_URL: jdbc:postgresql://postgres-auth:5432/${POSTGRES_DB:-auth_db}
      AUTH_DB_USER: ${POSTGRES_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  user-service:
    build: ../backend/user-service
    container_name: banking-user-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
      USER_DB_URL: jdbc:postgresql://postgres-user:5432/${USER_DB_NAME:-user_db}
      USER_DB_USER: ${USER_DB_USER:-user_user}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  account-service:
    build: ../backend/account-service
    container_name: banking-account-service
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
      ACCOUNT_DB_URL: jdbc:postgresql://postgres-account:5432/${ACCOUNT_DB_NAME:-account_db}
      ACCOUNT_DB_USER: ${ACCOUNT_DB_USER:-account_user}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  transaction-service:
    build: ../backend/transaction-service
    container_name: banking-transaction-service
    ports:
      - "8086:8086"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
      TRANSACTION_DB_URL: jdbc:postgresql://postgres-transaction:5432/${TRANSACTION_DB_NAME:-transaction_db}
      TRANSACTION_DB_USER: ${TRANSACTION_DB_USER:-transaction_user}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?TRANSACTION_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres-transaction:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  transfer-service:
    build: ../backend/transfer-service
    container_name: banking-transfer-service
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka/
      TRANSFER_DB_URL: jdbc:postgresql://postgres-transfer:5432/${TRANSFER_DB_NAME:-transfer_db}
      TRANSFER_DB_USER: ${TRANSFER_DB_USER:-transfer_user}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:?TRANSFER_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      ACCOUNT_SERVICE_URL: http://account-service:8084
      ACCOUNT_CONNECT_TIMEOUT_MS: ${ACCOUNT_CONNECT_TIMEOUT_MS:-2000}
      ACCOUNT_READ_TIMEOUT_MS: ${ACCOUNT_READ_TIMEOUT_MS:-3000}
      ACCOUNT_RETRY_ATTEMPTS: ${ACCOUNT_RETRY_ATTEMPTS:-2}
      ACCOUNT_RETRY_DELAY_MS: ${ACCOUNT_RETRY_DELAY_MS:-100}
      TRANSACTION_SERVICE_URL: http://transaction-service:8086
      TRANSACTION_CONNECT_TIMEOUT_MS: ${TRANSACTION_CONNECT_TIMEOUT_MS:-2000}
      TRANSACTION_READ_TIMEOUT_MS: ${TRANSACTION_READ_TIMEOUT_MS:-3000}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres-transfer:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build: ../frontend
    container_name: banking-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-auth-data:
  postgres-user-data:
  postgres-account-data:
  postgres-transfer-data:
  postgres-transaction-data:
