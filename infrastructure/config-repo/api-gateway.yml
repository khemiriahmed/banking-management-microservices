spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            enabled: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            - id: demo-service
              uri: lb://DEMO-SERVICE
              predicates:
                - Path=/demo/**
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/accounts/**,/admin/accounts/**,/beneficiaries/**
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**,/admin/**
